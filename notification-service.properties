spring.application.name=notification-service
server.port=8085

# 1. ALLOW CONFIG SERVER FETCHING IN KUBERNETES/DOCKER
spring.cloud.config.enabled=true

# 2. PostgreSQL Connection Strings
spring.datasource.url=jdbc:postgresql://postgres:5432/quizdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. EXPLICITLY SET THE DIALECT (Forces Hibernate to bypass JDBC metadata checks)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Eureka Registry Discovery Routing
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

# 5. RabbitMQ Event Queue Messaging
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# 6. Gmail SMTP Target Pipeline
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.debug=true

# 7. Distributed Tracing Core Stack
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
management.endpoints.web.exposure.include=health,info,metrics,prometheus