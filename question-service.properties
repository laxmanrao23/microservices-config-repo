spring.application.name=question-service
server.port=5001

spring.cloud.config.fail-fast=true

spring.cloud.config.retry.initial-interval=5000
spring.cloud.config.retry.max-attempts=20
spring.cloud.config.retry.max-interval=10000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/questiondb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
management.endpoints.web.exposure.include=health,info,metrics,prometheus